name: Test API


on:
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4


      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest


      - name: Ejecutar tests
        run: pytest
